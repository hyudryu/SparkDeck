AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SparkDeck community auth — Cognito user pool with native email/password
  sign-up and login (no social providers), public SPA app client calling the
  Cognito API directly (USER_PASSWORD_AUTH + refresh tokens).

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: sparkdeck-community
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      AutoVerifiedAttributes:
        - email
      # Branded transactional email for both sign-up confirmation and password
      # reset codes (one template serves both flows, so the copy stays generic).
      # The default Cognito sender is used; a custom FROM address requires SES.
      VerificationMessageTemplate:
        EmailSubject: Your SparkDeck verification code
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailMessage: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <meta name="color-scheme" content="light dark">
          <meta name="supported-color-schemes" content="light dark">
          <title>Your SparkDeck verification code</title>
          </head>
          <body style="margin:0;padding:0;background-color:#f1f5f9;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f1f5f9;">
              <tr>
                <td align="center" style="padding:32px 16px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="width:560px;max-width:100%;">
                    <tr>
                      <td style="background-color:#0f172a;border-radius:12px 12px 0 0;padding:24px 32px;">
                        <span style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#ffffff;letter-spacing:0.5px;">Spark<span style="color:#38bdf8;">Deck</span></span><br>
                        <span style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#94a3b8;letter-spacing:2px;text-transform:uppercase;">Community telemetry</span>
                      </td>
                    </tr>
                    <tr>
                      <td style="background-color:#ffffff;padding:32px;">
                        <p style="margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1e293b;">Hi there,</p>
                        <p style="margin:0 0 24px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1e293b;">Use this verification code to confirm your SparkDeck community account and complete your request:</p>
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                          <tr>
                            <td align="center" style="border:2px solid #38bdf8;border-radius:10px;padding:20px 16px;background-color:#f0f9ff;">
                              <span style="font-family:'Courier New',Courier,monospace;font-size:34px;font-weight:bold;letter-spacing:10px;color:#0f172a;">{####}</span>
                            </td>
                          </tr>
                        </table>
                        <p style="margin:24px 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#475569;">This code expires in 24 hours.</p>
                        <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#475569;">If you didn&rsquo;t request this code, you can safely ignore this email &mdash; nothing will change on your account.</p>
                      </td>
                    </tr>
                    <tr>
                      <td style="background-color:#f8fafc;border-top:1px solid #e2e8f0;border-radius:0 0 12px 12px;padding:20px 32px;">
                        <p style="margin:0 0 4px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#64748b;">SparkDeck &middot; local-first LLM control plane</p>
                        <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#94a3b8;">This is an automated message &mdash; please do not reply.</p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </body>
          </html>
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      UserPoolTags:
        app: sparkdeck
        component: community-auth

  SpaClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: sparkdeck-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      # "Stay logged in indefinitely": refresh tokens last the Cognito maximum
      # (10 years); the app silently refreshes short-lived ID/access tokens.
      RefreshTokenValidity: 3650
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
  SpaClientId:
    Value: !Ref SpaClient
  IssuerUrl:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  JwksUrl:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json'
